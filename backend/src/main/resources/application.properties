# Configuracion del servidor
server.port=8080

# El frontend se sirve desde ../frontend/index.html gracias a WebController.
# Excluimos el index.html empaquetado para que Spring Boot no registre un
# welcome page automatico (que ganaria a nuestro controller en "/").
# Mantenemos add-mappings=true por si en el futuro agregas CSS/JS estaticos.
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=false

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de sesion
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Configuracion de CORS (si se necesita global)
# cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
